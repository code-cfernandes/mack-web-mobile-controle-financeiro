<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro Pessoal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Controle Financeiro</h1>
    <p>Registre e acompanhe seus gastos de forma consciente (ODS 1 e ODS 12)</p>
  </header>

  <main>
    <section id="dashboard" class="metricas" aria-label="Painel de métricas">
      <div class="card">
        <span class="rotulo">Saldo Total</span>
        <span id="saldo-total" class="valor">R$ 0,00</span>
      </div>
      <div class="card">
        <span class="rotulo">Total de Despesas</span>
        <span id="total-despesas" class="valor">R$ 0,00</span>
      </div>
      <div class="card destaque">
        <span class="rotulo">Total Gasto por Impulso</span>
        <span id="gasto-impulso" class="valor">R$ 0,00</span>
      </div>
    </section>

    <section class="formulario">
      <h2>Nova transação</h2>
      <form id="form-transacao">
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" name="descricao" placeholder="Ex.: Conta de Luz" required>

        <label for="valor">Valor (R$)</label>
        <input type="number" id="valor" name="valor" step="0.01" min="0.01" required>

        <fieldset>
          <legend>Tipo</legend>
          <label><input type="radio" name="tipo" value="receita" required> Receita</label>
          <label><input type="radio" name="tipo" value="despesa" checked> Despesa</label>
        </fieldset>

        <label for="categoria">Categoria</label>
        <input type="text" id="categoria" name="categoria" placeholder="Ex.: Moradia, Alimentação, Lazer" required>

        <label class="checkbox">
          <input type="checkbox" id="consumo-consciente" name="consumoConsciente" checked>
          Gasto consciente (essencial)
        </label>

        <button type="submit">Salvar</button>
      </form>
    </section>

    <section class="extrato">
      <h2>Extrato</h2>
      <ul id="historico"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
